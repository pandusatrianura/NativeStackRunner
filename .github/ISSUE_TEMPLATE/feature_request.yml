name: 💡 Feature Request
description: Suggest an idea or enhancement for NativeStackRunner
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve NativeStackRunner! Share your idea for a new service, CLI flag, or DX enhancement.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the problem or limitation you are encountering.
      placeholder: I am frustrated when developing applications that require...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear description of what you want to happen and how it should work.
      placeholder: Add support for standalone MySQL / MariaDB binaries in stack.yaml...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, or examples of other tools here.
    validations:
      required: false
