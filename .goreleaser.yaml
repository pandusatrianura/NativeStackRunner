# GoReleaser configuration for Native Stack Runner (stack)
version: 2

project_name: stack

before:
  hooks:
    - go mod tidy

builds:
  - id: stack
    main: ./cmd/stack
    binary: stack
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/pandusatrianura/NativeStackRunner/cmd/stack.Version={{.Version}}
      - -X github.com/pandusatrianura/NativeStackRunner/cmd/stack.Commit={{.Commit}}
      - -X github.com/pandusatrianura/NativeStackRunner/cmd/stack.BuildDate={{.Date}}
      - -X main.Version={{.Version}}
      - -X main.Commit={{.Commit}}
      - -X main.BuildDate={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    builds:
      - stack
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE*
      - examples/stack.yaml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

release:
  replace_existing_artifacts: true
  replace_existing_draft: true

brews:
  - name: stack
    repository:
      owner: pandusatrianura
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew formula update for {{ .ProjectName }} version {{ .Tag }}"
    directory: Formula
    homepage: "https://github.com/pandusatrianura/NativeStackRunner"
    description: "Native Stack Runner (NSR) — Fast, containerless dependency manager"
    license: "MIT"
    install: |
      bin.install "stack"
    test: |
      system "#{bin}/stack --version"
    skip_upload: auto

scoops:
  - name: stack
    repository:
      owner: pandusatrianura
      name: scoop-bucket
      branch: main
      token: "{{ .Env.SCOOP_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Scoop update for {{ .ProjectName }} version {{ .Tag }}"
    directory: bucket
    homepage: "https://github.com/pandusatrianura/NativeStackRunner"
    description: "Native Stack Runner (NSR) — Fast, containerless dependency manager"
    license: "MIT"
    skip_upload: auto

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
